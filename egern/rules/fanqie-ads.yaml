# 番茄小说去广告单独规则（Egern rule_set，策略在主配置里给 REJECT）
# 合并来源（2026-10-30 拉取核对）：
#   1) zqzess/rule_for_quantumultX Surge/Module/FanQieNovel.sgmodule（v3.1）
#      https://raw.githubusercontent.com/zqzess/rule_for_quantumultX/master/Surge/Module/FanQieNovel.sgmodule
#   2) 可莉（luestr）番茄小说去广告，经 QingRex/LoonKissSurge 转 Surge（文件日期 2025-11-12）
#      https://raw.githubusercontent.com/QingRex/LoonKissSurge/refs/heads/main/Surge/番茄小说去广告.sgmodule
#   3) 补录（2026-10-30 二轮核对）：changzhaoCZ 屠龙刀（AdGuard 版）、abclq/home-dns-adblock
#      实测 DNS 清单、hcnote 抓包 hosts —— 只收精确/前缀限定的广告项，通配按前缀限定
#      （如 ads*-normal-*），不收整段通配（*byte* / *toutiao* / snssdk.com 整段等）。
#      已核对未收：lf3-reading.fqnovelpic.com（屠龙刀收、但其他规则集专门放行它保插图，冲突，跳过）；
#      tnc*-*.zijieapi.com（屠龙刀自己都备注可能要为评论区放行，跳过）；
#      qznovelvod 的 reading-ad 系列（那是七猫的，不是番茄，跳过）。
# 2026-10-30 修复（听书进度保存不了）：删除 dig.bdurl.net 与 dig.zjurl.cn。
#   zqzess 仓库 issue #66（2026-02-08）已证实：拦 dig.bdurl.net 会影响听书功能，
#   报告者给的解法就是去掉这行/改 DIRECT。bdurl/zjurl 是字节的动态链接解析服务，
#   听书的音频地址解析也走它，不能当普通短链广告域拦。用户实测中招后删除。
# v4（2026-10-30，播放优先版）：只拦「广告下发链路」，其余全部放行——
#   配置下发（tnc/security/mssdk/gecko/vcs/abtest）、监控日志上报（timon/mcs/mon/applog/toblog）、
#   消息同步（easemob msync）、增值/特效（vas/effect）、整段后缀（byteorge/bytegoofy/bytedance）、
#   以及 6 个 IP（查证为 abtest/mssdk/tnc 的配置节点 IP）统统删除。
#   原则：拦「来取广告的」，不拦「往回传数据的」和「下发配置的」，后两类误伤播放的风险最高。
# 本文件只做分流层 REJECT（域名/IP）；章末广告的 URL Rewrite 不在 rule_set 能力内，见文末说明。
#
# 已剔除的上游误伤项（不要加回来）：
#   - DOMAIN-KEYWORD,zijieapi（zqzess）：整段封字节接口域，会误伤抖音/头条等其他字节系 App
#     → 已用下方 zijieapi 的精确广告子域替代（ads/minigame/gecko/mssdk 等）
#   - DOMAIN-SUFFIX,bytedance.com（zqzess）：字节官网域，与看广告无关，剔除
#   - DOMAIN-SUFFIX,byteorge.com / bytegoofy.com（zqzess）：整段封太宽，精确的 gecko3/gecko5 已收
#   - security.snssdk.com（可莉版有收）：抖音账号登录要走它（AdGuard 版番茄规则专门给它放行），
#     番茄用抖音号登录的话封了会登不上 → 未收；security-lq.snssdk.com 同理未收
#   - DOMAIN,imapi3-normal-lf.zijieapi.com,DIRECT（zqzess）：那是给整段封 zijieapi 打的补丁，
#     本文件不整段封，所以不需要这条放行
# v3 删除（2026-10-30，用户抓日志实证）：is.snssdk.com / is-lq.snssdk.com / ma.zijieapi.com
#   三者都出现在正常听书请求里（is 单次回 148KB 数据），不是纯广告域，放行保播放。
# 保留存疑项（出问题优先删这几条）：
#   - ip_cidr_set 的 6 个 /32：上游给的广告 IP，IP 可能被运营商回收复用，误伤时整段删掉即可
#   - msync-im1-vip6-std.easemob.com：环信 IM 的同步域，若番茄私信/消息异常先删它
#
# ⚠️ 顺序要求：主配置里这条 rule_set 必须放在 ByteDance 直连规则集之前。
#    ByteDance 集里有 snssdk.com / zijieapi.com / pstatp.com / byteimg.com / ixigua.com /
#    toutiaocloud.com 的 DOMAIN-SUFFIX DIRECT，本文件域名几乎全落在里面，
#    放在它后面将永远命中不到 REJECT。

domain_set:
  - p3-ad-sign.byteimg.com
  - p6-ad-sign.byteimg.com
  - p9-ad-sign.byteimg.com
  - p3-developer.bytemaimg.com
  - i.snssdk.com
  - i-lq.snssdk.com
  - ad.toutiao.com
  - zlink.toutiao.com
  - ichannel.snssdk.com
  - activity-ag.awemeughun.com
  - api.iegadp.qq.com
  - apd-pcdnwxlogin.teg.tencent-cloud.net
  - sf3-ttcdn-tos.pstatp.com
  - zlink.ugsdk.cn
  - ecombdimg.com
  - praisewindow.ugsdk.cn
  - webcast-open.douyin.com
  - p11-webcast-sign.douyinpic.com
  - p3-webcast-sign.douyinpic.com
  - lf-normal-gr-sourcecdn.bytegecko.com
  - lf-webcast-gr-sourcecdn.bytegecko.com
  - ads3-normal.zijieapi.com
  - ads5-normal.zijieapi.com
  - minigame3-normal.zijieapi.com
  - minigame5-normal.zijieapi.com

domain_suffix_set:
  - pglstatp-toutiao.com
  - pangolin-sdk-toutiao.com
  - pangolin-sdk-toutiao1.com

domain_wildcard_set:
  - "*default.ixigua.com"
  - ads*-normal-*.zijieapi.com
  - minigame*-normal-*.zijieapi.com
  - p*-webcast-sign.douyinpic.com

# ---- 章末广告说明（本文件管不到的部分）----
# 章末/文中广告走 URL Rewrite 拦 pangolin-sdk-toutiao 的 get_ads 接口，
# rule_set 文件装不下重写规则。你现用配置的 modules 里已经挂了上游原版模块
# （zqzess FanQieNovel.sgmodule），现在是 enabled: false；
# 只开分流不够、还想去章末广告的话，把它改成 enabled: true 即可，
# 但注意那个模块自带整段 zijieapi 封锁，开启后其他字节系 App 异常先关它排查。
